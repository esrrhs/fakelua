name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          if [ "${{ matrix.build }}" = "release" ]; then
            ./build.sh release
          else
            ./build.sh
          fi

      - name: Unit tests
        run: ./bin/fake_tests --gtest_color=yes

      - name: Benchmark
        run: ./bin/fake_bench --benchmark_min_time=0.1s --benchmark_color=false
