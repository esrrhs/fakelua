name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release, asan, cov]
        test_group: [A, B, C, D]
        exclude:
          # Only run full test suite on cov build for coverage accuracy
          # Other builds use parallel test groups for speed
          - build_type: debug
            test_group: D
          - build_type: release
            test_group: D
          - build_type: asan
            test_group: D

    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Lua
        timeout-minutes: 10
        run: |
          # 从 GitHub 镜像编译 Lua 源码，避免 apt 镜像（azure.archive.ubuntu.com）间歇性超时卡死
          # make a 只构建 liblua.a（无需 readline），fakelua 只需头文件 + liblua.a
          git clone --depth 1 --branch v5.4.8 https://github.com/lua/lua.git
          cd lua
          make a -j$(nproc)
          # 手动安装头文件 + 库（该 makefile 无 install 目标）
          sudo cp liblua.a /usr/local/lib/
          sudo cp lua.h luaconf.h lualib.h lauxlib.h /usr/local/include/
          # 测试 CMake 的 fallback 路径查找 /usr/include/lua5.4，建子目录适配
          sudo mkdir -p /usr/include/lua5.4
          for h in lua.h luaconf.h lualib.h lauxlib.h; do
            sudo ln -sf "/usr/local/include/$h" "/usr/include/lua5.4/$h"
          done
          sudo ldconfig
          cd ..
          rm -rf lua
          ls -l /usr/include/lua5.4/

      - name: Setup TCC
        if: matrix.build_type == 'asan' || matrix.build_type == 'cov'
        run: |
          git clone https://github.com/TinyCC/tinycc.git
          cd tinycc
          ./configure --extra-cflags="-fPIC"
          make -j$(nproc)
          sudo make install
          cd ..

      - name: Setup lcov
        if: matrix.build_type == 'cov'
        run: |
          wget https://github.com/linux-test-project/lcov/releases/download/v2.0/lcov-2.0.tar.gz
          tar -xf lcov-2.0.tar.gz
          cd lcov-2.0/
          sudo make install
          yes|sudo perl -MCPAN -e 'install Capture::Tiny'
          sudo apt-get install libdatetime-perl -y
          sudo rm /usr/bin/lcov -f
          sudo ln -s /usr/local/bin/lcov /usr/bin/lcov
          lcov --version
          cd ..

      - name: Setup MySQL
        run: |
          # Wait for MySQL to be ready
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          # Configure root user to use mysql_native_password (MySQL 8 defaults to caching_sha2_password)
          mysql -h 127.0.0.1 -uroot -proot <<'EOF' 2>/dev/null || true
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';
            CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED WITH mysql_native_password BY 'root';
            ALTER USER 'root'@'127.0.0.1' IDENTIFIED WITH mysql_native_password BY 'root';
            CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';
            ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
            CREATE DATABASE IF NOT EXISTS test;
            FLUSH PRIVILEGES;
          EOF
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" 2>/dev/null && echo "MySQL auth OK" || echo "MySQL auth failed"
          echo "MySQL ready"

      - name: Build (${{ matrix.build_type }})
        run: |
          set -x
          rm -rf build
          mkdir build
          cd build

          # Select CMake flags based on build type
          case "${{ matrix.build_type }}" in
            debug)
              CMAKE_FLAGS=""
              ;;
            release)
              CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release"
              ;;
            asan)
              CMAKE_FLAGS="-DUSE_ASAN=ON"
              export ASAN_OPTIONS=detect_leaks=0
              ;;
            cov)
              CMAKE_FLAGS="-DUSE_COV=ON"
              ;;
          esac

          cmake ${CMAKE_FLAGS} ..
          make -j$(nproc)

      - name: Test Group A (basic/math/string/json)
        if: matrix.test_group == 'A'
        run: |
          cd $GITHUB_WORKSPACE/test/lua && $GITHUB_WORKSPACE/build/bin/unit_tests \
            --gtest_filter="test_basic.*:test_math.*:test_string.*:test_json.*:test_serialize.*:test_algo.*:test_random.*:test_table.*:test_common.*"

      - name: Test Group B (io/compress/log/crypto)
        if: matrix.test_group == 'B'
        run: |
          cd $GITHUB_WORKSPACE/test/lua && $GITHUB_WORKSPACE/build/bin/unit_tests \
            --gtest_filter="test_io.*:test_compress.*:test_log.*:test_crypto.*:test_csv.*:test_exception.*:test_utf8.*:test_os.*:test_package.*"

      - name: Test Group C (net/event/timer/protobuf)
        if: matrix.test_group == 'C'
        run: |
          cd $GITHUB_WORKSPACE/test/lua && $GITHUB_WORKSPACE/build/bin/unit_tests \
            --gtest_filter="test_net.*:test_event.*:test_timer.*:test_protobuf.*:test_ini.*:test_toml.*:test_yaml.*:test_xml.*:test_native.*"

      - name: Test Group D (mysql/sqlite/misc)
        if: matrix.test_group == 'D' && matrix.build_type == 'cov'
        run: |
          cd $GITHUB_WORKSPACE/test/lua && $GITHUB_WORKSPACE/build/bin/unit_tests \
            --gtest_filter="test_mysql.*:test_sqlite.*:test_closure.*:test_infer.*:test_jitter.*:test_runtime.*:test_state.*:test_syntax_tree.*:test_util.*:test_var.*:test_vm_cvar_call.*"

      - name: Run benchmarks and flua
        if: matrix.test_group == 'A'
        run: |
          cd build
          ./bin/bench_mark
          ./bin/flua

      - name: MySQL integration tests
        if: matrix.test_group == 'D' && matrix.build_type == 'cov'
        run: |
          cd $GITHUB_WORKSPACE/test/lua && $GITHUB_WORKSPACE/build/bin/unit_tests --gtest_filter="test_mysql.integration_callback_api"

      - name: Coverage report
        if: matrix.build_type == 'cov' && matrix.test_group == 'D'
        run: |
          set -x
          cd build
          echo "function main() return 0 end" > test.lua
          ./bin/flua --repeat=2 test.lua
          lcov --directory ./ --capture --output-file coverage.info --ignore-errors source --ignore-errors mismatch
          ls -l coverage.info
          lcov --list coverage.info
          bash <(curl -s https://codecov.io/bash) -t ${{ secrets.CODECOV }} -f coverage.info || echo "Codecov did not collect coverage reports"
