name: Fuzz

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly on Sunday at 3:37 UTC
    - cron: '37 3 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration per target (seconds)'
        required: false
        default: '300'
        type: string

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_compile, fuzz_differential]

    steps:
      - uses: actions/checkout@v1

      - name: Setup Lua
        timeout-minutes: 10
        run: |
          # 从 GitHub 镜像编译 Lua 源码，避免 apt 镜像（azure.archive.ubuntu.com）间歇性超时卡死
          # make a 只构建 liblua.a（无需 readline），fakelua 只需头文件 + liblua.a
          git clone --depth 1 --branch v5.4.8 https://github.com/lua/lua.git
          cd lua
          make a -j$(nproc)
          # 手动安装头文件 + 库（该 makefile 无 install 目标）
          sudo cp liblua.a /usr/local/lib/
          # fuzz_differential 用 -llua5.4 链接，建 symlink 适配
          sudo ln -sf /usr/local/lib/liblua.a /usr/local/lib/liblua5.4.a
          sudo cp lua.h luaconf.h lualib.h lauxlib.h /usr/local/include/
          # 测试/fuzz CMake 查找 /usr/include/lua5.4，建子目录适配
          sudo mkdir -p /usr/include/lua5.4
          for h in lua.h luaconf.h lualib.h lauxlib.h; do
            sudo ln -sf "/usr/local/include/$h" "/usr/include/lua5.4/$h"
          done
          sudo ldconfig
          cd ..
          rm -rf lua

      - name: Install clang
        run: |
          # ubuntu-24.04 runner 通常预装 clang；仅在缺失时才走 apt，避免 apt 镜像间歇性卡死
          if command -v clang++ >/dev/null 2>&1; then
            echo "clang already installed: $(clang++ --version | head -1)"
          else
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
            sudo apt-get install -y -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" clang
          fi

      - name: Setup TCC
        run: |
          git clone https://github.com/TinyCC/tinycc.git
          cd tinycc
          ./configure --extra-cflags="-fPIC"
          make -j$(nproc)
          sudo make install
          cd ..

      - name: Build fakelua + fuzz_bridge
        run: |
          set -x
          rm -rf build
          mkdir build && cd build
          # Use clang for everything in CI (newer clang on ubuntu-24.04
          # handles the libstdc++ headers fine)
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DBUILD_FUZZ=ON
          make fuzz_bridge -j$(nproc)

      - name: Build fuzz target
        run: |
          set -x
          cd build
          # Build the fuzz target binary with libFuzzer
          FUZZ_FLAGS="-fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer -g"
          INC_FLAGS="-I../include -I../src -I../src/platform -I../fuzz"

          mkdir -p bin

          if [ "${{ matrix.target }}" = "fuzz_differential" ]; then
            clang++ ${FUZZ_FLAGS} \
              ${INC_FLAGS} -I/usr/include/lua5.4 \
              ../fuzz/${{ matrix.target }}.cpp \
              -L lib -L lib64 -L /usr/lib/x86_64-linux-gnu \
              -lfuzz_bridge -lfakelua -llua5.4 \
              -Wl,-rpath,lib -Wl,-rpath,lib64 \
              -o bin/${{ matrix.target }}
          else
            clang++ ${FUZZ_FLAGS} \
              ${INC_FLAGS} \
              ../fuzz/${{ matrix.target }}.cpp \
              -L lib -L lib64 \
              -lfuzz_bridge -lfakelua \
              -Wl,-rpath,lib -Wl,-rpath,lib64 \
              -o bin/${{ matrix.target }}
          fi

      - name: Run fuzz (${{ matrix.target }})
        run: |
          set -x
          cd build

          # Determine run duration:
          # - PR: quick 60-second smoke test
          # - Push to master: 10 min per target
          # - Weekly schedule: 60 min per target
          # - Manual dispatch: user-specified duration
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DURATION=60
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DURATION=${{ github.event.inputs.duration }}
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            DURATION=3600
          else
            DURATION=600
          fi

          echo "Fuzzing ${{ matrix.target }} for ${DURATION}s..."

          # Run fuzzer with time limit
          # -max_total_time: stop after N seconds
          # -max_len: max input length (smaller = faster iteration)
          # Use seed corpus if available
          CORPUS_DIR="../fuzz/corpus/seed"
          DICT_FILE="../fuzz/lua_keywords.dict"

          # -error_exitcode / -timeout_exitcode are set explicitly so the two
          # cases can be told apart below. libFuzzer's own defaults (77 for a
          # bug, 70 for a timeout) are easy to misread.
          ASAN_OPTIONS=detect_leaks=0 \
          UBSAN_OPTIONS=print_stacktrace=1 \
          ./bin/${{ matrix.target }} \
            ${CORPUS_DIR} \
            -dict=${DICT_FILE} \
            -max_len=4096 \
            -max_total_time=${DURATION} \
            -error_exitcode=1 \
            -timeout_exitcode=70 \
            -print_final_stats=1 \
            2>&1 | tee fuzz_${{ matrix.target }}.log

          # Exit codes:
          #   0  = clean exit (budget exhausted, no bugs found)
          #   1  = bug found (crash / OOM / leak), see -error_exitcode above
          #   70 = per-input timeout (slow unit), non-fatal
          FUZZ_EXIT=${PIPESTATUS[0]}
          if [ ${FUZZ_EXIT} -eq 70 ]; then
            echo "::warning::Fuzzer ${{ matrix.target }} hit a per-input timeout (exit 70), treating as non-fatal"
          elif [ ${FUZZ_EXIT} -ne 0 ]; then
            echo "::error::Fuzzer ${{ matrix.target }} found a bug (exit ${FUZZ_EXIT})!"
            exit 1
          fi

          echo "Fuzzing ${{ matrix.target }} completed successfully."

      - name: Upload fuzz artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            build/bin/${{ matrix.target }}
            build/fuzz_${{ matrix.target }}.log
            build/crash-*
            build/leak-*
            build/timeout-*
            build/oom-*
            build/slow-unit-*
          retention-days: 30

      - name: Upload fuzz log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-log-${{ matrix.target }}
          path: build/fuzz_${{ matrix.target }}.log
          retention-days: 7
