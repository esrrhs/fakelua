name: BuildWithMacOS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          brew update || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install lua || brew link --overwrite lua
          # Find Lua include and lib paths
          LUA_INC_DIR="$(brew --prefix)/include"
          echo "LUA_INC_DIR=$LUA_INC_DIR"
          ls "$LUA_INC_DIR"
          # Find the actual lua.h location
          find "$(brew --prefix)" -name "lua.h" -type f 2>/dev/null || true
          # Set pkg-config path
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Setup MySQL
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mysql
          # Start MySQL
          brew services start mysql
          sleep 5
          # Wait for MySQL to be ready
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          # Set root password (Homebrew MySQL starts with empty password)
          # Try without password first, then with 'root' if already set
          MYSQL_PWD="" mysql -h 127.0.0.1 -uroot -e "SELECT 1" 2>/dev/null && echo "MYSQL_AUTH=empty" >> $GITHUB_ENV || {
            MYSQL_PWD="root" mysql -h 127.0.0.1 -uroot -e "SELECT 1" 2>/dev/null && echo "MYSQL_AUTH=root" >> $GITHUB_ENV || {
              echo "MYSQL_AUTH=failed" >> $GITHUB_ENV
            }
          }

      - name: Configure MySQL auth
        if: env.MYSQL_AUTH != 'failed'
        run: |
          if [ "$MYSQL_AUTH" = "empty" ]; then
            MYSQL_CMD="mysql -h 127.0.0.1 -uroot"
          else
            MYSQL_CMD="mysql -h 127.0.0.1 -uroot -proot"
          fi
          # Enable mysql_native_password plugin (disabled by default in MySQL 8.4+)
          $MYSQL_CMD -e "INSTALL PLUGIN mysql_native_password SONAME 'mysql_native_password.so';" 2>/dev/null || true
          $MYSQL_CMD -e "SET GLOBAL require_secure_transport = OFF;" 2>/dev/null || true
          $MYSQL_CMD -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';"
          $MYSQL_CMD -e "CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED WITH mysql_native_password BY 'root';"
          $MYSQL_CMD -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;"
          $MYSQL_CMD -e "CREATE DATABASE IF NOT EXISTS test;"
          $MYSQL_CMD -e "FLUSH PRIVILEGES;"
          echo "MySQL auth configured"

      - name: Build
        run: |
          set -x
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_PREFIX_PATH="$(brew --prefix)" ..
          make -j$(sysctl -n hw.ncpu)
          ctest -V
          ./bin/bench_mark
          ./bin/flua
          # MySQL 集成测试（需要 MySQL 服务）
          if [ "$MYSQL_AUTH" != "failed" ]; then
            ./bin/unit_tests --gtest_filter="test_mysql.integration_*"
          else
            echo "MySQL integration tests skipped (no MySQL)"
          fi
