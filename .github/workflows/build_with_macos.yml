name: BuildWithMacOS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-release
          max-size: 2G

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Setup dependencies
        run: |
          brew update || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install lua || brew link --overwrite lua
          # Find Lua include and lib paths
          LUA_INC_DIR="$(brew --prefix)/include"
          echo "LUA_INC_DIR=$LUA_INC_DIR"
          ls "$LUA_INC_DIR"
          # Find the actual lua.h location
          find "$(brew --prefix)" -name "lua.h" -type f 2>/dev/null || true
          # Set pkg-config path
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Setup MySQL
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mysql
          # Start MySQL
          brew services start mysql
          sleep 5
          # Wait for MySQL to be ready
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          # Homebrew MySQL starts with an empty root password. The workflow
          # comment previously claimed to set it, but it only detected auth and
          # created the database with MYSQL_PWD="". Tests require root/root on
          # 127.0.0.1:3306 and database test (same contract as Linux/Windows).
          SQL="
          CREATE DATABASE IF NOT EXISTS test;
          CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'root';
          ALTER USER 'root'@'127.0.0.1' IDENTIFIED BY 'root';
          ALTER USER 'root'@'localhost' IDENTIFIED BY 'root';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          "
          configured=0
          for pwd in "" "root"; do
            if MYSQL_PWD="$pwd" mysql -h 127.0.0.1 -uroot --protocol=tcp -e "$SQL"; then
              configured=1
              break
            fi
          done
          if [ "$configured" -ne 1 ]; then
            echo "Failed to configure MySQL test user (root/root) and database"
            exit 1
          fi
          MYSQL_PWD="root" mysql -h 127.0.0.1 -uroot --protocol=tcp -e "SELECT 1"
          echo "MySQL configured (root/root, database test)"

      - name: Setup Redis
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install redis
          brew services start redis || redis-server --daemonize yes --bind 127.0.0.1 --port 6379
          for i in $(seq 1 30); do
            if redis-cli -h 127.0.0.1 ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi
            echo "Waiting for Redis... ($i)"
            sleep 2
          done
          echo "Redis did not become ready"
          exit 1

      - name: Build
        timeout-minutes: 60
        run: |
          set -x
          export CPM_SOURCE_CACHE=$HOME/.cache/CPM
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_PREFIX_PATH="$(brew --prefix)" ..
          make -j$(sysctl -n hw.ncpu)
          ccache -s
          # Run all tests (including MySQL / Redis integration tests)
          (cd $GITHUB_WORKSPACE/test/lua && $GITHUB_WORKSPACE/build/bin/unit_tests)
          # Lifecycle contract: init/update/fini call counts and order,
          # flua.set_exit semantics, exit code. Entry points are fixed to
          # package "main", so no flags are needed.
          ./bin/flua "$GITHUB_WORKSPACE/cmd/test.lua"

      - name: Run benchmarks
        run: |
          set -x
          cd build/bin
          ./bench_mark
