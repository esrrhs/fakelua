name: BuildWithMacOS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          brew update || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install lua || brew link --overwrite lua
          # Find Lua include and lib paths
          LUA_INC_DIR="$(brew --prefix)/include"
          echo "LUA_INC_DIR=$LUA_INC_DIR"
          ls "$LUA_INC_DIR"
          # Find the actual lua.h location
          find "$(brew --prefix)" -name "lua.h" -type f 2>/dev/null || true
          # Set pkg-config path
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Setup MySQL
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mysql
          # Start MySQL
          brew services start mysql
          sleep 5
          # Wait for MySQL to be ready
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done
          # Set root password (Homebrew MySQL starts with empty password)
          # Try without password first, then with 'root' if already set
          mysql -h 127.0.0.1 -uroot -e "SELECT 1" 2>/dev/null && echo "MySQL no password OK" || {
            echo "Setting root password..."
            mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" 2>/dev/null && echo "MySQL password already set" || {
              echo "Failed to connect to MySQL"
              exit 1
            }
          }
          # Configure root user to use mysql_native_password and create root@127.0.0.1
          mysql -h 127.0.0.1 -uroot -proot <<'EOF' || mysql -h 127.0.0.1 -uroot <<'EOF'
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';
            CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED WITH mysql_native_password BY 'root';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
            CREATE DATABASE IF NOT EXISTS test;
            FLUSH PRIVILEGES;
          EOF
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" && echo "MySQL auth OK" || echo "MySQL auth failed"
          echo "MySQL ready"

      - name: Build
        run: |
          set -x
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_PREFIX_PATH="$(brew --prefix)" ..
          make -j$(sysctl -n hw.ncpu)
          ctest -V
          ./bin/bench_mark
          ./bin/flua
          # MySQL 集成测试（需要 MySQL 服务）
          ./bin/unit_tests --gtest_filter="test_mysql.integration_*" || echo "MySQL integration tests skipped (no MySQL)"
