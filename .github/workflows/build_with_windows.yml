name: BuildWithWindows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL
        run: |
          choco install mysql -y
          echo "MySQL installed"

      - name: Start MySQL
        run: |
          # Find and start MySQL service
          $service = Get-Service | Where-Object { $_.Name -like "*MySQL*" } | Select-Object -First 1
          if ($service) {
            Write-Host "Found MySQL service: $($service.Name)"
            Start-Service $service.Name
            Start-Sleep -Seconds 10
          } else {
            Write-Host "MySQL service not found, trying to start..."
            net start MySQL80 2>$true
            net start MySQL 2>$true
          }
          $mysql = (Get-Command mysql.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
          if (-not $mysql) {
            $mysql = Get-ChildItem "C:\\Program Files\\MySQL" -Recurse -Filter mysql.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $mysql) {
            throw "mysql.exe not found"
          }
          & $mysql -h 127.0.0.1 -uroot -e "SELECT 1" 2>$null
          if ($LASTEXITCODE -eq 0) {
            & $mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS test;"
          } else {
            & $mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" 2>$null
            if ($LASTEXITCODE -ne 0) {
              throw "unable to authenticate to local MySQL as root"
            }
            & $mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS test;"
          }
          echo "MySQL started"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          set -eux
          rm -rf build
          cmake -S . -B build -G Ninja -DFAKELUA_TINYCC_GIT_URL=https://github.com/TinyCC/tinycc.git

      - name: Build
        shell: msys2 {0}
        run: |
          set -eux
          cmake --build build --parallel

      - name: Test
        shell: msys2 {0}
        run: |
          set -eux
          cd $GITHUB_WORKSPACE/test/lua && $GITHUB_WORKSPACE/build/bin/unit_tests.exe

      - name: Run benchmarks and flua
        shell: msys2 {0}
        run: |
          set -eux
          cd build/bin
          ./bench_mark.exe
          ./flua.exe
