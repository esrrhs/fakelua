name: BuildWithWindows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL
        run: |
          choco install mysql -y
          echo "MySQL installed"

      - name: Start MySQL
        run: |
          # Find and start MySQL service
          $service = Get-Service | Where-Object { $_.Name -like "*MySQL*" } | Select-Object -First 1
          if ($service) {
            Write-Host "Found MySQL service: $($service.Name)"
            Start-Service $service.Name
            Start-Sleep -Seconds 10
          } else {
            Write-Host "MySQL service not found, trying to start..."
            net start MySQL80 2>$true
            net start MySQL 2>$true
          }
          # Find mysql.exe path
          $mysqlPath = Get-ChildItem -Path "C:\Program Files\MySQL" -Recurse -Filter "mysql.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mysqlPath) {
            Write-Host "Found mysql at: $($mysqlPath.FullName)"
            $mysql = $mysqlPath.FullName
          } else {
            $mysql = "mysql"
          }
          # Configure auth plugin using --skip-ssl to bypass SSL requirement
          & $mysql -uroot --skip-ssl -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;" 2>$true
          if ($LASTEXITCODE -ne 0) {
            & $mysql -uroot --get-server-public-key -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;" 2>$true
          }
          if ($LASTEXITCODE -ne 0) {
            & $mysql -uroot -proot --skip-ssl -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;" 2>$true
          }
          if ($LASTEXITCODE -ne 0) {
            & $mysql -uroot -proot --get-server-public-key -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;" 2>$true
          }
          echo "MySQL configured"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          set -eux
          rm -rf build
          cmake -S . -B build -G Ninja -DFAKELUA_TINYCC_GIT_URL=https://github.com/TinyCC/tinycc.git

      - name: Build
        shell: msys2 {0}
        run: |
          set -eux
          cmake --build build --parallel

      - name: Test
        shell: msys2 {0}
        run: |
          set -eux
          ctest --test-dir build -V

      - name: Run benchmarks and flua
        shell: msys2 {0}
        run: |
          set -eux
          cd build/bin
          ./bench_mark.exe
          ./flua.exe
